# ===================================================================
# Mensagens do Chatbot WhatsApp (MMEEBB - Internato Médico UNIPAM)
# Idioma: Português do Brasil (pt_BR)
# ===================================================================

bot.welcome=👋 Olá, futuro(a) médico(a)! Bem-vindo(a) ao *Bot de Repetição Espaçada do Internato (UNIPAM)*.\n\n📚 Seu cadastro foi registrado com sucesso!\nVocê receberá questões clínicas diárias espaçadas na base binária (2^n).\n\n💡 Você pode conversar comigo enviando mensagens normais, por exemplo:\n• Digite *revisar* para iniciar sua revisão diária\n• Digite *desempenho* para acompanhar seus acertos e retenção\n• Digite *ajuda* para ver como o método funciona

bot.help=🩺 *CENTRAL DE AJUDA - BOT MMEEBB (UNIPAM)*\n\nEste assistente utiliza o Método de Memorização Exponencial Efetivo na Base Binária (2^n) para otimizar seus estudos no internato médico.\n\n📌 *Você pode enviar mensagens normais como:*\n• *revisar* ou *questão* - Inicia suas revisões clínicas pendentes do dia.\n• *desempenho* ou *estatísticas* - Exibe suas métricas de acerto e taxa de retenção.\n• *ajuda* - Exibe esta mensagem com orientações.\n\n💬 Para responder a uma questão clínica, basta digitar a letra da sua alternativa (*A*, *B*, *C*, *D* ou *E*).

bot.menu=🩺 Olá, *{0}*!\n\nComo posso te ajudar nos estudos hoje? Você pode digitar:\n• *revisar* - Para responder às suas revisões clínicas pendentes\n• *desempenho* - Para ver suas métricas de acerto\n• *ajuda* - Para entender mais sobre o método binário

bot.stats.title=📊 *SEU DESEMPENHO NO INTERNATO MÉDICO (MMEEBB)*\n\n👤 *Aluno:* {0}\n📅 *Período:* {1}º Período de Medicina\n\n📈 *Métricas de Aprendizagem:*\n• Total de Questões Respondidas: *{2}*\n• Total de Acertos: *{3}*\n• Taxa de Retenção / Precisão: *{4}%*\n• Temas em Acompanhamento Ativo: *{5}*\n\n💡 _Continue revisando diariamente para expandir seus intervalos no ciclo exponencial!_

bot.review.none=🩺 Olá, {0}! Você não possui questões pendentes no momento.\nSeu próximo ciclo de revisões será disparado automaticamente no seu horário programado.
bot.review.completed=🎉 *Parabéns!* Você concluiu todas as revisões agendadas para hoje!
bot.answer.invalid=⚠️ Por favor, responda com a letra da alternativa desejada (ex: *A*, *B*, *C* ou *D*).

bot.answer.correct=✅ *PARABÉNS! RESPOSTA CORRETA! (Alternativa {0})*\n\n💡 *Justificativa Clínica:*\n{1}\n\n📊 *Progresso no MMEEBB (Base Binária):*\n• Novo nível do ciclo: *n = {2}*\n• Próxima revisão deste tema: em *{3} dias* (2^{2}).

bot.answer.incorrect=❌ *RESPOSTA INCORRETA (Você escolheu: {0})*\n\n🎯 *Gabarito Correto: Alternativa {1}*\n\n💡 *Justificativa Clínica:*\n{2}\n\n🔄 *Ajuste no MMEEBB:*\n• O ciclo foi reiniciado para *n = 0*.\n• Reforço imediato agendado para *amanhã* (1 dia).

