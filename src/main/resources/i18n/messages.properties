bot.welcome=👋 Olá, *{0}*! Bem-vindo(a) ao *Bot MMEEBB de Repetição Espaçada ({1} - UNIPAM)*.\n🆔 *RA:* {2}\n\n📚 Sua matrícula institucional foi validada com sucesso!\nVocê receberá questões periódicas espaçadas na base binária (2^n).\n\n💡 Você pode conversar comigo enviando mensagens normais, por exemplo:\n• Envie *revisar* para iniciar sua revisão\n• Envie *desempenho* para acompanhar seus acertos e retenção\n• Envie *ajuda* para ver como o método funciona\n• Ou tire qualquer dúvida sobre a matéria diretamente aqui!

bot.registration.not_found=👋 Olá! Seja bem-vindo(a) ao *Bot de Estudos MMEEBB (UNIPAM)*.\n\n⚠️ Não localizamos uma matrícula institucional associada a este número de WhatsApp.\n\n👉 *Por favor, digite apenas o seu RA institucional (ex: 23000388)* para localizarmos seus dados acadêmicos e liberarmos seu acesso!

bot.registration.ra_invalid=❌ Não localizamos nenhum registro acadêmico ativo na UNIPAM com o RA *{0}*.\n\nPor favor, confira o número digitado ou procure a coordenação do seu curso para verificar seu cadastro.

bot.registration.ra_linked=🎉 *RA {0} vinculado com sucesso!*

bot.help=🎓 *CENTRAL DE AJUDA - BOT MMEEBB (UNIPAM)*\n\nEste assistente utiliza o Método de Memorização Exponencial Efetivo na Base Binária (2^n) para otimizar seus estudos acadêmicos.\n\n📌 *Você pode enviar mensagens normais como:*\n• *revisar* ou *questão* - Inicia suas revisões pendentes do dia.\n• *desempenho* ou *estatísticas* - Exibe suas métricas de acerto e taxa de retenção.\n• *ajuda* - Exibe esta mensagem com orientações.\n• Ou envie qualquer dúvida em linguagem natural sobre o conteúdo!\n\n💬 Para responder a uma questão, basta digitar a letra da sua alternativa (*A*, *B*, *C*, *D* ou *E*) ou explicar sua resposta.

bot.menu=🎓 Olá, *{0}*!\n\nComo posso te ajudar nos estudos hoje? Você pode digitar:\n• *revisar* - Para responder às suas revisões pendentes\n• *desempenho* - Para ver suas métricas de acerto\n• *ajuda* - Para entender mais sobre o método binário\n• Ou me faça uma pergunta sobre a matéria!

bot.stats.title=📊 *SEU DESEMPENHO ACADÊMICO (MMEEBB)*\n\n👤 *Aluno:* {0} (RA: {1})\n🎓 *Curso:* {2} ({3}º Período)\n\n📈 *Métricas de Aprendizagem:*\n• Total de Questões Respondidas: *{4}*\n• Total de Acertos: *{5}*\n• Taxa de Retenção / Precisão: *{6}%*\n• Temas em Acompanhamento Ativo: *{7}*\n\n💡 _Continue revisando diariamente para expandir seus intervalos no ciclo exponencial!_

bot.review.none=🎓 Olá, {0}! Você não possui questões pendentes no momento.\nSeu próximo ciclo de revisões será disparado automaticamente no seu horário programado.
bot.review.completed=🎉 *Parabéns!* Você concluiu todas as revisões agendadas para hoje!
bot.answer.invalid=⚠️ Por favor, responda com a letra da alternativa desejada (ex: *A*, *B*, *C* ou *D*).

bot.answer.correct=✅ *PARABÉNS! RESPOSTA CORRETA! (Alternativa {0})*\n\n💡 *Justificativa Comentada:*\n{1}\n\n📊 *Progresso no MMEEBB (Base Binária):*\n• Novo nível do ciclo: *n = {2}*\n• Próxima revisão deste tema: em *{3} dias* (2^{2}).

bot.answer.incorrect=❌ *RESPOSTA INCORRETA (Você escolheu: {0})*\n\n🎯 *Gabarito Correto: Alternativa {1}*\n\n💡 *Justificativa Comentada:*\n{2}\n\n🔄 *Ajuste no MMEEBB:*\n• O ciclo foi reiniciado para *n = 0*.\n• Reforço imediato agendado para *amanhã* (1 dia).

