bot.welcome=👋 Hello, *{0}*! Welcome to the *MMEEBB Spaced Repetition Bot ({1} - UNIPAM)*.\n🆔 *ID (RA):* {2}\n\n📚 Your institutional enrollment was validated successfully!\nYou will receive periodic review questions spaced in binary base (2^n).\n\n💡 You can talk to me with normal messages, for example:\n• Send *review* to start your review\n• Send *stats* to check your accuracy and retention\n• Send *help* to see how the method works\n• Or ask any questions about your coursework directly here!

bot.registration.not_found=👋 Hello! Welcome to the *MMEEBB Study Bot (UNIPAM)*.\n\n⚠️ We could not find an institutional student record associated with this WhatsApp number.\n\n👉 *Please type only your Student ID (RA, e.g. 23000388)* so we can locate your academic records and unlock your access!

bot.registration.ra_invalid=❌ We could not find any active UNIPAM academic record with Student ID (RA) *{0}*.\n\nPlease check the number you typed or contact your department.

bot.registration.ra_linked=🎉 *Student ID (RA) {0} successfully linked!*

bot.help=🎓 *HELP CENTER - MMEEBB BOT (UNIPAM)*\n\nThis assistant uses the Effective Exponential Memorization Method in Binary Base (2^n) to optimize your academic studies.\n\n📌 *You can send normal messages such as:*\n• *review* or *question* - Starts your pending reviews.\n• *stats* or *performance* - Shows your accuracy rate and retention metrics.\n• *help* - Displays this help message.\n• Or ask any questions in natural language about your subjects!\n\n💬 To answer a question, just send the option letter (*A*, *B*, *C*, *D*, or *E*) or explain your reasoning.

bot.menu=🎓 Hello, *{0}*!\n\nHow can I help with your studies today? You can send:\n• *review* - To answer pending questions\n• *stats* - To see your progress\n• *help* - To learn more about the binary method\n• Or ask me a question about your subject!

bot.stats.title=📊 *YOUR ACADEMIC PERFORMANCE (MMEEBB)*\n\n👤 *Student:* {0} (RA: {1})\n🎓 *Course:* {2} (Period {3})\n\n📈 *Learning Metrics:*\n• Total Questions Answered: *{4}*\n• Total Correct: *{5}*\n• Retention / Accuracy Rate: *{6}%*\n• Topics Currently Tracked: *{7}*\n\n💡 _Keep reviewing daily to expand your intervals in the exponential cycle!_

bot.review.none=🎓 Hello, {0}! You have no pending reviews at this moment.\nYour next review cycle will be scheduled automatically.
bot.review.completed=🎉 *Congratulations!* You completed all scheduled reviews for today!
bot.answer.invalid=⚠️ Please reply with your desired option letter (e.g., *A*, *B*, *C*, or *D*).

bot.answer.correct=✅ *CONGRATULATIONS! CORRECT ANSWER! (Option {0})*\n\n💡 *Explanation:*\n{1}\n\n📊 *MMEEBB Progress (Binary Base):*\n• New cycle level: *n = {2}*\n• Next review for this topic: in *{3} days* (2^{2}).

bot.answer.incorrect=❌ *INCORRECT ANSWER (You chose: {0})*\n\n🎯 *Correct Option: {1}*\n\n💡 *Explanation:*\n{2}\n\n🔄 *MMEEBB Adjustment:*\n• Cycle reset to *n = 0*.\n• Immediate reinforcement scheduled for *tomorrow* (1 day).

