bot.welcome=👋 Hello, future doctor! Welcome to the *Medical Internship Spaced Repetition Bot (UNIPAM)*.\n\n📚 Your profile has been registered successfully!\nYou will receive daily clinical questions spaced using the binary base (2^n).\n\n💡 You can talk to me by sending regular messages, for example:\n• Type *review* to start your daily review\n• Type *stats* to track your performance and retention\n• Type *help* to see how the method works

bot.help=🩺 *HELP CENTER - MMEEBB BOT (UNIPAM)*\n\nThis assistant uses the Effective Exponential Memorization Method in Binary Base (2^n) to optimize your medical internship studies.\n\n📌 *You can send everyday words like:*\n• *review* or *question* - Starts your pending clinical reviews for the day.\n• *stats* or *performance* - Shows your accuracy rate and retention metrics.\n• *help* - Displays this help message.\n\n💬 To answer a clinical case, simply reply with your chosen option letter (*A*, *B*, *C*, *D*, or *E*).

bot.menu=🩺 Hello, *{0}*!\n\nHow can I help with your studies today? You can type:\n• *review* - Answer pending clinical reviews\n• *stats* - View your accuracy metrics\n• *help* - Learn more about the binary spaced method

bot.stats.title=📊 *YOUR MEDICAL INTERNSHIP PERFORMANCE (MMEEBB)*\n\n👤 *Student:* {0}\n📅 *Semester:* Semester {1} of Medicine\n\n📈 *Learning Metrics:*\n• Total Questions Answered: *{2}*\n• Total Correct Answers: *{3}*\n• Retention / Accuracy Rate: *{4}%*\n• Active Monitored Topics: *{5}*\n\n💡 _Keep reviewing daily to expand your intervals on the exponential curve!_

bot.review.none=🩺 Hello, {0}! You have no pending reviews right now.\nYour next review cycle will be sent automatically at your scheduled time.
bot.review.completed=🎉 *Congratulations!* You have completed all scheduled reviews for today!
bot.answer.invalid=⚠️ Please reply with the option letter corresponding to your choice (e.g. *A*, *B*, *C*, or *D*).

bot.answer.correct=✅ *CONGRATULATIONS! CORRECT ANSWER! (Option {0})*\n\n💡 *Clinical Explanation:*\n{1}\n\n📊 *MMEEBB Progress (Binary Base):*\n• New cycle level: *n = {2}*\n• Next review for this topic: in *{3} days* (2^{2}).

bot.answer.incorrect=❌ *INCORRECT ANSWER (You selected: {0})*\n\n🎯 *Correct Answer: Option {1}*\n\n💡 *Clinical Explanation:*\n{2}\n\n🔄 *MMEEBB Adjustment:*\n• The cycle was reset to *n = 0*.\n• Immediate reinforcement scheduled for *tomorrow* (1 day).

