# ===================================================================
# Mensajes del Chatbot WhatsApp (MMEEBB - Internado Médico)
# Idioma: Español (es)
# ===================================================================

bot.welcome=👋 ¡Hola, futuro(a) médico(a)! Bienvenido(a) al *Bot de Repetición Espaciada del Internado (UNIPAM)*.\n\n📚 ¡Tu registro se completó con éxito!\nRecibirás preguntas clínicas diarias espaciadas en base binaria (2^n).\n\n💡 Puedes hablar conmigo enviando mensajes normales, por ejemplo:\n• Escribe *revisar* para iniciar tu repaso diario\n• Escribe *rendimiento* para ver tus aciertos y retención\n• Escribe *ayuda* para ver cómo funciona el método

bot.help=🩺 *CENTRO DE AYUDA - BOT MMEEBB (UNIPAM)*\n\nEste asistente utiliza el Método de Memorización Exponencial Efectivo en Base Binaria (2^n) para optimizar tus estudios en el internado médico.\n\n📌 *Puedes enviar mensajes cotidianos como:*\n• *revisar* o *pregunta* - Inicia tus revisiones clínicas pendientes del día.\n• *rendimiento* o *estadisticas* - Muestra tu tasa de aciertos y retención.\n• *ayuda* - Muestra este mensaje de orientación.\n\n💬 Para responder a un caso clínico, solo envía la letra de tu opción (*A*, *B*, *C*, *D* o *E*).

bot.menu=🩺 ¡Hola, *{0}*!\n\n¿Cómo puedo ayudarte en tus estudios hoy? Puedes escribir:\n• *revisar* - Para responder revisiones clínicas pendientes\n• *rendimiento* - Para ver tus estadísticas de acierto\n• *ayuda* - Para conocer más sobre el método binario

bot.stats.title=📊 *TU RENDIMIENTO EN EL INTERNADO MÉDICO (MMEEBB)*\n\n👤 *Estudiante:* {0}\n📅 *Período:* {1}º Período de Medicina\n\n📈 *Métricas de Aprendizaje:*\n• Total de Preguntas Respondidas: *{2}*\n• Total de Aciertos: *{3}*\n• Tasa de Retención / Precisión: *{4}%*\n• Temas en Seguimiento Activo: *{5}*\n\n💡 _¡Sigue repasando a diario para expandir tus intervalos en el ciclo exponencial!_

bot.review.none=🩺 ¡Hola, {0}! No tienes revisiones pendientes en este momento.\nTu próximo ciclo de repaso se enviará automáticamente en tu horario programado.
bot.review.completed=🎉 *¡Felicitaciones!* ¡Has completado todas las revisiones programadas para hoy!
bot.answer.invalid=⚠️ Por favor, responde con la letra de la opción deseada (ej: *A*, *B*, *C* o *D*).

bot.answer.correct=✅ *¡FELICITACIONES! ¡RESPUESTA CORRECTA! (Opción {0})*\n\n💡 *Justificación Clínica:*\n{1}\n\n📊 *Progreso en MMEEBB (Base Binaria):*\n• Nuevo nivel del ciclo: *n = {2}*\n• Próxima revisión de este tema: en *{3} días* (2^{2}).

bot.answer.incorrect=❌ *RESPUESTA INCORRECTA (Elegiste: {0})*\n\n🎯 *Respuesta Correcta: Opción {1}*\n\n💡 *Justificación Clínica:*\n{2}\n\n🔄 *Ajuste en MMEEBB:*\n• El ciclo se reinició a *n = 0*.\n• Refuerzo inmediato programado para *mañana* (1 día).

