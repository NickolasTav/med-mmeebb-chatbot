bot.welcome=👋 ¡Hola, *{0}*! Bienvenido(a) al *Bot MMEEBB de Repetición Espaciada ({1} - UNIPAM)*.\n🆔 *ID (RA):* {2}\n\n📚 ¡Tu registro institucional ha sido validado con éxito!\nRecibirás preguntas periódicas espaciadas en base binaria (2^n).\n\n💡 Puedes chatear conmigo enviando mensajes normales, por ejemplo:\n• Envía *revisar* para iniciar tu repaso\n• Envía *progreso* para ver tus métricas de acierto y retención\n• Envía *ayuda* para ver cómo funciona el método\n• ¡O haz cualquier pregunta sobre las materias directamente aquí!

bot.registration.not_found=👋 ¡Hola! Bienvenido(a) al *Bot de Estudios MMEEBB (UNIPAM)*.\n\n⚠️ No encontramos un registro de matrícula institucional asociado a este número de WhatsApp.\n\n👉 *Por favor, escribe solo tu RA institucional (ej: 23000388)* para buscar tus datos académicos y habilitar tu acceso.

bot.registration.ra_invalid=❌ No encontramos ningún registro académico activo en la UNIPAM con el RA *{0}*.\n\nPor favor, verifica el número ingresado o comunícate con la coordinación de tu carrera.

bot.registration.ra_linked=🎉 *¡RA {0} vinculado con éxito!*

bot.help=🎓 *CENTRO DE AYUDA - BOT MMEEBB (UNIPAM)*\n\nEste asistente utiliza el Método de Memorización Exponencial Efectivo en Base Binaria (2^n) para optimizar tus estudios académicos.\n\n📌 *Puedes enviar mensajes normales como:*\n• *revisar* o *pregunta* - Inicia tus repasos pendientes del día.\n• *progreso* o *estadísticas* - Muestra tus métricas de acierto y tasa de retención.\n• *ayuda* - Muestra este mensaje de orientación.\n• ¡O envía cualquier duda en lenguaje natural sobre las materias!\n\n💬 Para responder a una pregunta, simplemente escribe la letra de tu alternativa (*A*, *B*, *C*, *D* o *E*) o explica tu respuesta.

bot.menu=🎓 ¡Hola, *{0}*!\n\n¿Cómo puedo ayudarte en tus estudios hoy? Puedes escribir:\n• *revisar* - Para responder a tus repasos pendientes\n• *progreso* - Para ver tus métricas de acierto\n• *ayuda* - Para aprender más sobre el método binario\n• ¡O hazme una pregunta sobre la materia!

bot.stats.title=📊 *TU RENDIMIENTO ACADÉMICO (MMEEBB)*\n\n👤 *Estudiante:* {0} (RA: {1})\n🎓 *Carrera:* {2} (Semestre {3})\n\n📈 *Métricas de Aprendizaje:*\n• Total de Preguntas Respondidas: *{4}*\n• Total de Aciertos: *{5}*\n• Tasa de Retención / Precisión: *{6}%*\n• Temas en Seguimiento Activo: *{7}*\n\n💡 _¡Sigue repasando diariamente para ampliar tus intervalos en el ciclo exponencial!_

bot.review.none=🎓 ¡Hola, {0}! No tienes preguntas pendientes en este momento.\nTu próximo ciclo de repasos se programará automáticamente.
bot.review.completed=🎉 *¡Felicitaciones!* ¡Completaste todos los repasos programados para hoy!
bot.answer.invalid=⚠️ Por favor, responde con la letra de la opción deseada (ej: *A*, *B*, *C* o *D*).

bot.answer.correct=✅ *¡FELICITACIONES! ¡RESPUESTA CORRECTA! (Opción {0})*\n\n💡 *Justificación Comentada:*\n{1}\n\n📊 *Progreso en MMEEBB (Base Binaria):*\n• Nuevo nivel del ciclo: *n = {2}*\n• Próximo repaso de este tema: en *{3} días* (2^{2}).

bot.answer.incorrect=❌ *RESPUESTA INCORRECTA (Elegiste: {0})*\n\n🎯 *Opción Correcta: {1}*\n\n💡 *Justificación Comentada:*\n{2}\n\n🔄 *Ajuste en MMEEBB:*\n• El ciclo se reinició a *n = 0*.\n• Refuerzo inmediato programado para *mañana* (1 día).

