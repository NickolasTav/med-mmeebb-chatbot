# ===================================================================
# Mensajes del Chatbot WhatsApp (MMEEBB - UNIPAM)
# Idioma: Español (es)
# ===================================================================

bot.welcome=👋 ¡Hola, {0}! Bienvenido(a) al *Bot MMEEBB de Repetición Espaciada ({1} - UNIPAM)*.\n\n📚 ¡Tu registro se completó con éxito!\nRecibirás preguntas periódicas espaciadas en la base binaria (2^n).\n\n💡 Puedes conversar conmigo enviando mensajes normales, por ejemplo:\n• Envía *revisar* para iniciar tu repaso\n• Envía *rendimiento* para ver tus aciertos y retención\n• Envía *ayuda* para ver cómo funciona el método\n• ¡O haz cualquier pregunta sobre la materia directamente aquí!

bot.help=🎓 *CENTRO DE AYUDA - BOT MMEEBB (UNIPAM)*\n\nEste asistente utiliza el Método de Memorización Exponencial Efectivo en Base Binaria (2^n) para optimizar tus estudios académicos.\n\n📌 *Puedes enviar mensajes normales como:*\n• *revisar* o *pregunta* - Inicia tus repasos pendientes del día.\n• *rendimiento* o *estadísticas* - Muestra tus métricas de acierto y tasa de retención.\n• *ayuda* - Muestra este mensaje con orientaciones.\n• ¡O envía cualquier duda en lenguaje natural sobre el contenido!\n\n💬 Para responder a una pregunta, simplemente escribe la letra de tu opción (*A*, *B*, *C*, *D* o *E*) o explica tu respuesta.

bot.menu=🎓 ¡Hola, *{0}*!\n\n¿Cómo puedo ayudarte en tus estudios hoy? Puedes escribir:\n• *revisar* - Para responder tus repasos pendientes\n• *rendimiento* - Para ver tus métricas de acierto\n• *ayuda* - Para aprender más sobre el método binario\n• ¡O hazme una pregunta sobre la materia!

bot.stats.title=📊 *TU RENDIMIENTO ACADÉMICO (MMEEBB)*\n\n👤 *Estudiante:* {0}\n🎓 *Carrera:* {1} (Período {2})\n\n📈 *Métricas de Aprendizaje:*\n• Total de Preguntas Respondidas: *{3}*\n• Total de Aciertos: *{4}*\n• Tasa de Retención / Precisión: *{5}%*\n• Temas en Seguimiento Activo: *{6}*\n\n💡 _¡Continúa repasando diariamente para expandir tus intervalos en el ciclo exponencial!_

bot.review.none=🎓 ¡Hola, {0}! No tienes repasos pendientes en este momento.\nTu próximo ciclo de repasos se programará automáticamente.
bot.review.completed=🎉 *¡Felicitaciones!* ¡Completaste todos los repasos programados para hoy!
bot.answer.invalid=⚠️ Por favor, responde con la letra de la opción deseada (ej: *A*, *B*, *C* o *D*).

bot.answer.correct=✅ *¡FELICITACIONES! ¡RESPUESTA CORRECTA! (Opción {0})*\n\n💡 *Justificación Comentada:*\n{1}\n\n📊 *Progreso en MMEEBB (Base Binaria):*\n• Nuevo nivel del ciclo: *n = {2}*\n• Próximo repaso de este tema: en *{3} días* (2^{2}).

bot.answer.incorrect=❌ *RESPUESTA INCORRECTA (Elegiste: {0})*\n\n🎯 *Opción Correcta: {1}*\n\n💡 *Justificación Comentada:*\n{2}\n\n🔄 *Ajuste en MMEEBB:*\n• El ciclo se reinició a *n = 0*.\n• Refuerzo inmediato programado para *mañana* (1 día).

