server:
  port: 8080

spring:
  application:
    name: med-mmeebb-chatbot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:med_mmeebb_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway gerencia o schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Configurações do Chatbot e UaiZap
uaizap:
  api:
    base-url: ${UAIZAP_BASE_URL:https://api.uaizap.com.br}
    instance-token: ${UAIZAP_TOKEN:dummy_token}
    instance-name: ${UAIZAP_INSTANCE:unipam_med_bot}
  outbound:
    delay-seconds: ${UAIZAP_OUTBOUND_DELAY_SECONDS:6} # Delay base de segurança Anti-Ban Meta
    jitter-enabled: ${UAIZAP_OUTBOUND_JITTER_ENABLED:true} # Variação aleatória (±1.5s)
    presence-simulation-enabled: ${UAIZAP_PRESENCE_SIMULATION_ENABLED:true} # Simula status "digitando..."
    presence-duration-seconds: ${UAIZAP_PRESENCE_DURATION_SECONDS:2} # Duração do status digitando
  webhook:
    secret-token: ${UAIZAP_WEBHOOK_SECRET:med_secret_key_123}

# Filas RabbitMQ
rabbitmq:
  queues:
    uaizap-inbound: q.uaizap.inbound.messages
    mmeebb-evaluations: q.med.mmeebb.evaluations
    uaizap-outbound: q.uaizap.outbound.dispatches
    dead-letter: q.med.deadletter
  listeners:
    uaizap-outbound:
      concurrency: ${RABBITMQ_OUTBOUND_CONCURRENCY:1} # Concorrência unitária para fila estritamente sequencial
  exchanges:
    med-direct: ex.med.direct
    dead-letter: ex.med.dlx
  routing-keys:
    inbound: rk.uaizap.inbound
    evaluations: rk.med.evaluations
    outbound: rk.uaizap.outbound
    dead-letter: rk.med.dlq

# Inteligência Artificial (LLM) - Google Gemini
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  enabled: ${GEMINI_ENABLED:true}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}

# Observabilidade & Métricas (Actuator + Prometheus + Micrometer)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true


