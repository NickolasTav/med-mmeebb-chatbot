spring:
  application:
    name: med-mmeebb-chatbot-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false # H2 usa create-drop para testes rápidos de unidade

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

uaizap:
  api:
    base-url: http://localhost:8989
    instance-token: test_token
    instance-name: test_instance
  outbound:
    delay-seconds: 0
    jitter-enabled: false
    presence-simulation-enabled: false
    presence-duration-seconds: 0
  webhook:
    secret-token: test_secret

rabbitmq:
  listeners:
    outbound:
      concurrency: 1
  queues:
    inbound: q.uaizap.inbound.test
    outbound: q.uaizap.outbound.test
    dlq: q.med.dlq.test

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


