name: Lint PR Title (Conventional Commits)

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-pr-title:
    name: 🏷️ Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Validar Título com Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: O título do PR deve iniciar com letra minúscula após o tipo.
