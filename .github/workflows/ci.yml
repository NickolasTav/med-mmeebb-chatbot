name: CI Pipeline - Build & Test

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Compilação, Testes e Verificação de Qualidade
  # ==========================================
  test-and-build:
    name: 🧪 Java 17 Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔐 Conceder permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: 🧪 Executar Testes Unitários e de Integração
        run: ./mvnw clean test -B

      - name: 📦 Empacotar Aplicação (JAR)
        run: ./mvnw package -DskipTests -B

      - name: 📊 Publicar Relatórios do Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ==========================================
  # Job 2: Validação de Build da Imagem Docker
  # ==========================================
  docker-validation:
    name: 🐳 Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Validar Build da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: med-mmeebb-chatbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
