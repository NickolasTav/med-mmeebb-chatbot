name: CD Pipeline - Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão para publicação (ex: v1.0.0)'
        required: false
        default: 'latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # Job 1: Quality Gate - Validação Obrigatória de Testes
  # ==========================================
  quality-gate-tests:
    name: 🧪 Quality Gate (Testes Obrigatórios de Produção)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔐 Conceder permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: 🧪 Executar Suíte Completa de Testes
        run: ./mvnw clean test -B

  # ==========================================
  # Job 2: Build e Publicação da Imagem Docker (Bloqueado se os testes falharem)
  # ==========================================
  publish-container:
    name: 🚀 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate-tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair Metadados e Tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 📦 Build e Push para o Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
